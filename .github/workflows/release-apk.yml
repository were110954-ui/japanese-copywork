name: Build and release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "배포 버전 (예: 1.2.1, v 제외)"
        required: true
        type: string
      version_code:
        description: "Android versionCode (비우면 1000 + Actions run number)"
        required: false
        type: string
      changelog:
        description: "앱 업데이트 안내에 표시할 변경점"
        required: false
        default: "기능 개선 및 오류 수정"
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION_NAME="${INPUT_VERSION_NAME#v}"
          else
            VERSION_NAME="${REF_NAME#v}"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $VERSION_NAME"; exit 1; }
          VERSION_CODE="${INPUT_VERSION_CODE:-$((1000 + GITHUB_RUN_NUMBER))}"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid versionCode: $VERSION_CODE"; exit 1; }
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "${INPUT_CHANGELOG:-자동 빌드 및 기능 개선}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit belongs to main
        if: github.event_name == 'push'
        shell: bash
        working-directory: .
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit contained in main."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Validate signing secrets
        shell: bash
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "Missing GitHub secret: ANDROID_$value"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/copywork-release.jks"

      - name: Grant Gradle Wrapper permission
        run: chmod +x gradlew

      - name: Test and build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/copywork-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          -PVERSION_CODE=${{ steps.version.outputs.code }}
          -PVERSION_NAME=${{ steps.version.outputs.name }}
          -PUPDATE_MANIFEST_URL=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/version.json

      - name: Standardize APK name and calculate SHA-256
        id: apk
        shell: bash
        working-directory: .
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk app-release.apk
          echo "sha256=$(sha256sum app-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Japanese Copywork ${{ steps.version.outputs.tag }}
          body: ${{ steps.version.outputs.changelog }}
          files: app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Generate version.json
        shell: bash
        working-directory: .
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/app-release.apk" \
            --arg changelog "$CHANGELOG" \
            --arg sha256 "$APK_SHA256" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,changelog:$changelog,sha256:$sha256}' \
            > "$RUNNER_TEMP/version.json"

      - name: Commit version.json to main
        shell: bash
        working-directory: .
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/version.json" version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish ${{ steps.version.outputs.tag }} metadata [skip ci]"
          git push origin main

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: JapaneseCopywork-${{ steps.version.outputs.tag }}
          path: app-release.apk
          if-no-files-found: error
